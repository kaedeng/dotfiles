# -- general -------------------------------------------------------------------

set -g default-terminal "tmux-256color"
# truecolor + colored/curly underlines + synchronized output (no half-drawn frames) from the outer terminal (ghostty sets TERM=xterm-ghostty)
set -as terminal-features ',xterm-ghostty:RGB:usstyle:sync,xterm-256color:RGB:usstyle'
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 1000000
set -g set-clipboard on
set -g mouse on
set -g focus-events on
set -gq allow-passthrough on # images in nvim (snacks.image / kitty graphics)
set -g visual-activity off
setw -g mode-keys vi
set -g allow-rename off
set -g automatic-rename on
set -g automatic-rename-format " #{pane_current_command}"


# -- keybindings ---------------------------------------------------------------

# prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# vim-like pane navigation (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim-like pane resizing (prefix + H/J/K/L, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"


# -- plugins -------------------------------------------------------------------

# tpm itself comes from homebrew (brew install tpm); plugins install to ~/.config/tmux/plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'christoomey/vim-tmux-navigator'


# -- catppuccin (installed by tpm, but run early so status-left can use its modules)

set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_modules_left "user"
set -g status-left-length 100
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_style bg=default
set -g @catppuccin_window_status_style "custom"

set -g @catppuccin_window_left_separator "#[bg=default,fg=#{@thm_surface_0}]█#[bg=#{@thm_surface_0},fg=#{@thm_fg}]"
set -g @catppuccin_window_right_separator "#[bg=default,fg=#{@thm_surface_0}]█"
# 1-cell pad so inactive windows match the width of the current one (whose middle sep is a 1-cell █)
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_current_left_separator "#[bg=default,fg=#{@thm_mauve}]█#[bg=#{@thm_mauve},fg=#{@thm_bg}]"
set -g @catppuccin_window_current_middle_separator "#[fg=#{@thm_mauve}]█"
set -g @catppuccin_window_current_right_separator "#[bg=default,fg=#{@thm_surface_1}]█"

set -g @catppuccin_status_background "none"
# square left edge for status-right modules (directory, session)
set -g @catppuccin_status_left_separator "█"

if-shell 'test -f ~/.config/tmux/plugins/tmux/catppuccin.tmux' "run '~/.config/tmux/plugins/tmux/catppuccin.tmux'"
# catppuccin's status_right_separator is a plain space, so the user module has no right edge
# cell and no gap before the first window. Rebuild it by hand: block edges + 1-cell gap.
set -g status-left "#[fg=#{@thm_sky},bg=default]█#[fg=#{@thm_crust},bg=#{@thm_sky}]#{@catppuccin_user_icon}#[fg=#{@thm_fg},bg=#{@thm_surface_0}]#{E:@catppuccin_user_text}#[fg=#{@thm_surface_0},bg=default]█ "
set -g status-style bg=default

# -- resurrect / continuum -----------------------------------------------------

set -g @continuum-restore 'off'
set -g @resurrect-strategy-nvim 'session'


# -- tpm (keep at bottom) ------------------------------------------------------

run '/opt/homebrew/opt/tpm/share/tpm/tpm'
